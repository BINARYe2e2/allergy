<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <title>KP ALLERSCAN - 메뉴판 알레르기 분석기</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0c0c0e;
      --panel-bg: #141417;
      --panel-border: #26262c;
      --accent-red: #9e1b29;
      --accent-red-hover: #b82233;
      --text-main: #f3f3f5;
      --text-muted: #8e8e99;
      --danger-bg: rgba(158, 27, 41, 0.12);
      --danger-text: #ff5c6c;
      --danger-border: rgba(158, 27, 41, 0.4);
      --safe-bg: rgba(20, 100, 45, 0.12);
      --safe-text: #4ade80;
      --safe-border: rgba(20, 100, 45, 0.4);
      --radius: 6px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; letter-spacing: -0.3px; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding: 30px 16px 50px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 580px; margin: 0 auto; }

    /* Header */
    .header { text-align: center; margin-bottom: 24px; padding-bottom: 18px; border-bottom: 1px solid var(--panel-border); }
    .header h1 { font-family: 'Montserrat', sans-serif; font-size: 26px; font-weight: 900; color: #ffffff; letter-spacing: 1.5px; }

    /* Tabs */
    .tabs { display: flex; background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: var(--radius); padding: 4px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 12px 0; border: none; border-radius: 4px; font-size: 13px; font-weight: 700; color: var(--text-muted); background: transparent; cursor: pointer; transition: all 0.2s ease; text-transform: uppercase; letter-spacing: 0.5px; }
    .tab-btn.active { color: #ffffff; background: var(--accent-red); box-shadow: 0 2px 8px rgba(158, 27, 41, 0.4); }

    /* Card */
    .card { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: var(--radius); padding: 24px; margin-bottom: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }

    /* Form Elements */
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.8px; }
    input[type="text"], textarea { width: 100%; padding: 13px 15px; border: 1px solid var(--panel-border); border-radius: var(--radius); font-size: 14px; background: #0c0c0e; color: #ffffff; outline: none; transition: border-color 0.2s; }
    input[type="text"]:focus, textarea:focus { border-color: var(--accent-red); }
    
    /* 입력창 상하 조절 방지 (고정 크기) */
    textarea { resize: none; min-height: 90px; }
    
    .profile-save-btn { margin-top: 8px; padding: 8px 14px; background: #26262c; color: #ffffff; border: 1px solid var(--panel-border); border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 700; transition: background 0.2s; }
    .profile-save-btn:hover { background: var(--accent-red); border-color: var(--accent-red); }

    /* Camera & File Scan Boxes */
    .scan-options { display: flex; gap: 10px; }
    .camera-scan-box { position: relative; flex: 1; border: 2px dashed var(--panel-border); border-radius: var(--radius); padding: 24px 10px; text-align: center; background: #0c0c0e; cursor: pointer; transition: all 0.2s; }
    .camera-scan-box:hover { border-color: var(--accent-red); background: rgba(158, 27, 41, 0.03); }
    .camera-scan-box input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    .camera-icon { font-size: 24px; margin-bottom: 6px; display: block; }
    .camera-label-text { font-size: 12px; color: var(--text-muted); font-weight: 500; }
    .camera-label-text strong { color: var(--accent-red); font-weight: 700; display: block; margin-top: 4px; font-size: 13px; }
    .selected-file-info { font-size: 12px; color: var(--safe-text); margin-top: 8px; text-align: center; font-weight: 700; }

    /* Submit Button */
    button.submit-btn { width: 100%; padding: 15px; background-color: var(--accent-red); color: white; border: none; border-radius: var(--radius); font-size: 14px; font-weight: 900; cursor: pointer; transition: background 0.2s; text-transform: uppercase; letter-spacing: 1px; }
    button.submit-btn:hover { background-color: var(--accent-red-hover); }
    button.submit-btn:disabled { background-color: #26262c; color: var(--text-muted); cursor: not-allowed; }
    
    #loading { display: none; text-align: center; color: #ffffff; font-weight: 500; font-size: 13px; margin-top: 16px; letter-spacing: 0.5px; }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 50%; border-top-color: var(--accent-red); animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Results */
    .result-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 14px; border-bottom: 1px solid var(--panel-border); margin-bottom: 16px; }
    .result-header h2 { font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .store-type { font-size: 11px; font-weight: 700; background: #0c0c0e; color: var(--accent-red); padding: 4px 10px; border: 1px solid var(--panel-border); border-radius: 4px; }
    
    .preview-img { width: 100%; max-height: 240px; object-fit: cover; border: 1px solid var(--panel-border); border-radius: var(--radius); margin-bottom: 16px; }

    .menu-title { font-size: 13px; font-weight: 700; margin-bottom: 12px; color: #ffffff; border-left: 3px solid var(--accent-red); padding-left: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .result-item { background: #0c0c0e; border: 1px solid var(--panel-border); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
    .menu-name-group { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
    .menu-name-ko { font-size: 14px; font-weight: 700; color: #ffffff; }
    .menu-name-en { font-size: 11px; color: var(--text-muted); font-weight: 400; }
    .ingredients-text { font-size: 12px; color: #a1a1aa; margin-bottom: 8px; line-height: 1.4; }
    
    .badge-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
    .badge { font-size: 10px; font-weight: 700; padding: 3px 7px; border-radius: 3px; letter-spacing: 0.3px; }
    .badge-safe { background: var(--safe-bg); color: var(--safe-text); border: 1px solid var(--safe-border); }
    .badge-allergy { background: var(--danger-bg); color: var(--danger-text); border: 1px solid var(--danger-border); }
    .badge-confidence { background: #1f1f26; color: var(--text-muted); border: 1px solid var(--panel-border); }
    
    .reasoning-box { font-size: 12px; background: #18181c; border: 1px solid var(--panel-border); padding: 8px 10px; border-radius: 4px; margin-top: 8px; color: #d4d4d8; line-height: 1.4; }
    .disclaimer { font-size: 11px; color: var(--text-muted); text-align: center; margin-top: 24px; padding-top: 14px; border-top: 1px solid var(--panel-border); line-height: 1.5; }

    .history-card { margin-bottom: 14px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>KP ALLERSCAN</h1>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('analyze')">SCAN MENU</button>
      <button class="tab-btn" onclick="switchTab('history')">LOGS</button>
    </div>

    <!-- Tab 1: 분석 섹션 -->
    <div id="section-analyze">
      <div class="card">
        <form id="uploadForm">
          <div class="form-group">
            <label for="restaurantId">RESTAURANT ID / USER ID</label>
            <input type="text" id="restaurantId" placeholder="예: test_store" required value="test_store" onchange="loadProfile()" onfocus="this.select()">
          </div>

          <div class="form-group">
            <label for="allergyProfile">알레르기 및 식이 주의사항 가이드</label>
            <p style="font-size: 11px; color: var(--accent-red); font-weight: 700; margin-bottom: 6px; letter-spacing: -0.2px;">
              💡 무엇을 피해야 하고, 어떤 예외가 있나요?
            </p>
            <textarea id="allergyProfile" placeholder="1. 주의/금지 식재료: (예: 들깨가루, 땅콩, 갑각류)
2. 예외 및 특이사항: (예: 들기름은 괜찮음, 매운 음식은 피함)"></textarea>
            <button type="button" class="profile-save-btn" onclick="saveProfile()">프로필 저장</button>
          </div>

          <div class="form-group">
            <label>MENU IMAGE INPUT (선택)</label>
            <div class="scan-options">
              <!-- 1. 카메라 직접 촬영 -->
              <label class="camera-scan-box">
                <span class="camera-icon">📷</span>
                <span class="camera-label-text">
                  직접 촬영
                  <strong>[ 카메라 실행 ]</strong>
                </span>
                <input type="file" accept="image/*" capture="environment" onchange="handleFileSelect(this, '카메라 촬영')">
              </label>

              <!-- 2. 갤러리/파일 선택 -->
              <label class="camera-scan-box">
                <span class="camera-icon">🖼️</span>
                <span class="camera-label-text">
                  갤러리 / 파일
                  <strong>[ 사진 불러오기 ]</strong>
                </span>
                <input type="file" accept="image/*" onchange="handleFileSelect(this, '갤러리 파일')">
              </label>
            </div>
            <div id="selectedFileInfo" class="selected-file-info"></div>
          </div>

          <button type="submit" class="submit-btn" id="submitBtn">EXECUTE SCAN & ANALYSIS</button>
        </form>
        <div id="loading"><span class="spinner"></span>메뉴판 성분과 맞춤 프로필을 정밀 대조 중입니다...</div>
      </div>

      <div class="card" id="resultCard" style="display: none;">
        <div class="result-header">
          <h2>DIAGNOSIS REPORT</h2>
          <span class="store-type" id="restaurantType">UNKNOWN</span>
        </div>
        <img id="previewImg" class="preview-img" src="" alt="Captured Image">
        <div class="menu-title">ANALYZED ITEMS & ALLERGENS</div>
        <div id="menuList"></div>

        <div class="disclaimer">
          ⚠️ 본 분석 결과는 참고용입니다. 최종 주문 시 매장 직원에게 반드시 재확인하세요.
        </div>
      </div>
    </div>

    <!-- Tab 2: 이력 조회 섹션 -->
    <div id="section-history" style="display: none;">
      <div class="card">
        <div class="form-group">
          <label for="searchRestaurantId">TARGET RESTAURANT ID</label>
          <input type="text" id="searchRestaurantId" value="test_store" placeholder="Enter Restaurant ID" onfocus="this.select()">
        </div>
        <button class="submit-btn" onclick="fetchHistory()">SEARCH LOGS</button>
      </div>
      <div id="historyResults"></div>
    </div>
  </div>

  <script>
    let selectedFile = null;

    window.addEventListener('DOMContentLoaded', () => {
      loadProfile();
    });

    function handleFileSelect(input, sourceName) {
      if (input.files && input.files[0]) {
        selectedFile = input.files[0];
        document.getElementById('selectedFileInfo').textContent = `✅ 선택됨 (${sourceName}): ${selectedFile.name}`;
      }
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (tabName === 'analyze') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('section-analyze').style.display = 'block';
        document.getElementById('section-history').style.display = 'none';
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('section-analyze').style.display = 'none';
        document.getElementById('section-history').style.display = 'block';
      }
    }

    async function loadProfile() {
      const restaurantId = document.getElementById('restaurantId').value;
      if (!restaurantId) return;
      try {
        const res = await fetch(`/api/v1/profile/${restaurantId}`);
        const data = await res.json();
        if (data.allergy_profile) {
          document.getElementById('allergyProfile').value = data.allergy_profile;
        }
      } catch (err) {
        console.error('프로필 로딩 실패', err);
      }
    }

    async function saveProfile() {
      const restaurantId = document.getElementById('restaurantId').value;
      const allergyProfile = document.getElementById('allergyProfile').value;
      if (!restaurantId) return alert('식당/사용자 ID를 입력해 주세요.');

      try {
        const res = await fetch('/api/v1/profile', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ restaurant_id: restaurantId, allergy_profile: allergyProfile })
        });
        const data = await res.json();
        alert(data.message || '프로필이 저장되었습니다.');
      } catch (err) {
        alert('프로필 저장 중 오류가 발생했습니다.');
      }
    }

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const restaurantId = document.getElementById('restaurantId').value;
      
      if (!selectedFile) {
        return alert('카메라 촬영 또는 갤러리 파일 선택을 통해 메뉴판 이미지를 지정해 주세요.');
      }

      const formData = new FormData();
      formData.append('restaurant_id', restaurantId);
      formData.append('file', selectedFile);

      const submitBtn = document.getElementById('submitBtn');
      const loading = document.getElementById('loading');
      const resultCard = document.getElementById('resultCard');

      submitBtn.disabled = true;
      loading.style.display = 'block';
      resultCard.style.display = 'none';

      try {
        const res = await fetch('/api/v1/parser/menu-image', {
          method: 'POST',
          body: formData
        });
        if (!res.ok) throw new Error('분석 요청 처리 중 오류가 발생했습니다.');
        const data = await res.json();

        document.getElementById('restaurantType').textContent = data.restaurant_type_estimated;
        document.getElementById('previewImg').src = data.image_url;

        const menuList = document.getElementById('menuList');
        menuList.innerHTML = '';
        data.items.forEach(item => {
          const allergens = item.detected_allergens.length
            ? item.detected_allergens.map(a => `<span class="badge badge-allergy">ALERT: ${a}</span>`).join('')
            : '<span class="badge badge-safe">CLEAR</span>';
          
          const reasoningHtml = item.reasoning ? `<div class="reasoning-box">📌 <strong>판정 근거:</strong> ${item.reasoning}</div>` : '';

          menuList.innerHTML += `
            <div class="result-item">
              <div class="menu-name-group">
                <span class="menu-name-ko">${item.menu_name_ko}</span>
                <span class="menu-name-en">${item.menu_name_en}</span>
              </div>
              <div class="ingredients-text">원재료: ${item.raw_ingredients_text}</div>
              <div class="badge-group">
                ${allergens}
                <span class="badge badge-confidence">CONFIDENCE ${item.confidence_score}%</span>
              </div>
              ${reasoningHtml}
            </div>`;
        });
        resultCard.style.display = 'block';
      } catch (err) {
        alert(err.message);
      } finally {
        submitBtn.disabled = false;
        loading.style.display = 'none';
      }
    });

    async function fetchHistory() {
      const restId = document.getElementById('searchRestaurantId').value;
      const container = document.getElementById('historyResults');
      if (!restId) return alert('업장 식별 코드를 입력하십시오.');

      try {
        const res = await fetch(`/api/v1/parser/history/${restId}`);
        const list = await res.json();

        if (list.length === 0) {
          container.innerHTML = '<div class="card"><p style="text-align:center; color:var(--text-muted); font-size:13px;">저장된 이력 데이터가 존재하지 않습니다.</p></div>';
          return;
        }

        container.innerHTML = list.map(item => `
          <div class="card history-card">
            <div class="result-header">
              <h3 style="font-size:13px; font-weight:700;">LOG #${item.id}</h3>
              <span class="store-type">${item.restaurant_type_estimated}</span>
            </div>
            <img src="${item.image_url}" class="preview-img" style="max-height: 180px;">
            <div class="menu-title">ITEMS (${item.items.length})</div>
            ${item.items.map(m => `
              <div class="result-item" style="padding:10px 12px; margin-bottom:6px;">
                <div class="menu-name-group">
                  <span class="menu-name-ko" style="font-size:13px;">${m.menu_name_ko}</span>
                  ${m.detected_allergens.length ? '<span class="badge badge-allergy">ALERT</span>' : '<span class="badge badge-safe">CLEAR</span>'}
                </div>
                ${m.reasoning ? `<div class="reasoning-box" style="margin-top:4px;">📌 ${m.reasoning}</div>` : ''}
              </div>
            `).join('')}
          </div>
        `).join('');
      } catch (err) {
        alert('이력 데이터 로딩에 실패했습니다.');
      }
    }
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('Service Worker registered!'))
          .catch(err => console.log('Service Worker registration failed: ', err));
      });
    }
  </script>
</body>
</html>
